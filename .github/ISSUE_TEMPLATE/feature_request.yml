name: Feature request
description: Suggest a new module, command or setting
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve for your server?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How should it work?
      description: Commands, settings, what members and moderators would see.
