name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -v

  bot-checks:
    name: Bot checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the migration guard compares against the base branch
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Slash commands build and respect Discord's limits
        run: uv run pytest tests/test_commands.py -v
      - name: Settings reference is up to date
        run: uv run python -m warden.docs --check
      - name: Shipped migrations are untouched
        if: github.event_name == 'pull_request'
        run: uv run python scripts/check_migrations.py origin/${{ github.base_ref }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: warden:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image starts and fails cleanly without a token
        run: |
          set +e
          output=$(docker run --rm warden:ci 2>&1)
          status=$?
          echo "$output"
          [ "$status" -ne 0 ] && echo "$output" | grep -q "DISCORD_TOKEN is not set"
