<svg xmlns="http://www.w3.org/2000/svg" width="760" height="634" viewBox="0 0 760 634" font-family="'gg sans','Noto Sans','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="Warden onboarding: welcome message, rules with an I agree button, and the welcome DM"><title>Warden onboarding: welcome message, rules with an I agree button, and the welcome DM</title><clipPath id="r"><rect width="760" height="634" rx="12"/></clipPath><g clip-path="url(#r)"><rect width="760" height="634" fill="#313338"/><rect x="0" y="0" width="760" height="46" fill="#2b2d31"/><rect x="0" y="46" width="760" height="1" fill="#1f2023"/><text x="20" y="30" font-size="22" fill="#949ba4">#</text><text x="44" y="29" font-size="16" font-weight="700" fill="#f2f3f5">welcome</text><circle cx="40" cy="86" r="20" fill="#5865f2"/><text x="40" y="93" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">W</text><text x="76" y="81" font-size="16" font-weight="600" fill="#5865f2">Warden</text><rect x="144" y="68" width="32" height="16" rx="3" fill="#5865f2"/><text x="160" y="80" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">APP</text><text x="188" y="81" font-size="12" fill="#949ba4">Today at 21:04</text><text x="76" y="104" font-size="15" fill="#dbdee1" font-weight="400" xml:space="preserve">Welcome to <tspan font-weight="700" fill="#f2f3f5">Night Owls</tspan>, <tspan fill="#c9cdfb" font-weight="500">@maya</tspan>! You're member #128.</text><rect x="0" y="110" width="760" height="10" fill="#1f2023"/><rect x="0" y="120" width="760" height="46" fill="#2b2d31"/><rect x="0" y="166" width="760" height="1" fill="#1f2023"/><text x="20" y="150" font-size="22" fill="#949ba4">#</text><text x="44" y="149" font-size="16" font-weight="700" fill="#f2f3f5">rules</text><circle cx="40" cy="206" r="20" fill="#5865f2"/><text x="40" y="213" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">W</text><text x="76" y="201" font-size="16" font-weight="600" fill="#5865f2">Warden</text><rect x="144" y="188" width="32" height="16" rx="3" fill="#5865f2"/><text x="160" y="200" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">APP</text><text x="188" y="201" font-size="12" fill="#949ba4">Today at 21:04</text><rect x="76" y="216" width="560" height="156" rx="4" fill="#2b2d31"/><rect x="76" y="216" width="4" height="156" rx="2" fill="#5865f2"/><text x="92" y="242" font-size="15" fill="#f2f3f5" font-weight="700" xml:space="preserve">Server rules</text><text x="92" y="268" font-size="14" fill="#dbdee1" font-weight="400" xml:space="preserve">1. Be kind. No harassment, hate speech or slurs.</text><text x="92" y="289" font-size="14" fill="#dbdee1" font-weight="400" xml:space="preserve">2. No spam, self-promotion or invite links.</text><text x="92" y="310" font-size="14" fill="#dbdee1" font-weight="400" xml:space="preserve">3. Keep it safe for work, including usernames and avatars.</text><text x="92" y="331" font-size="14" fill="#dbdee1" font-weight="400" xml:space="preserve">4. Moderators have the final say.</text><text x="92" y="354" font-size="12" fill="#949ba4" font-weight="400" xml:space="preserve">Press I agree to confirm you've read the rules.</text><rect x="76" y="380" width="112" height="32" rx="4" fill="#248046"/><text x="132.0" y="401" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">✓  I agree</text><circle cx="40" cy="448" r="20" fill="#5865f2"/><text x="40" y="455" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">W</text><text x="76" y="443" font-size="16" font-weight="600" fill="#5865f2">Warden</text><rect x="144" y="430" width="32" height="16" rx="3" fill="#5865f2"/><text x="160" y="442" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">APP</text><text x="188" y="443" font-size="12" fill="#949ba4">Today at 21:04</text><text x="76" y="466" font-size="15" fill="#dbdee1" font-weight="400" xml:space="preserve">Thanks! You now have <tspan fill="#c9cdfb" font-weight="500">@Verified</tspan>. Enjoy the server.</text><text x="76" y="489" font-size="12" fill="#949ba4" font-weight="400" xml:space="preserve">Only you can see this  ·  Dismiss message</text><rect x="0" y="494" width="760" height="10" fill="#1f2023"/><rect x="0" y="504" width="760" height="46" fill="#2b2d31"/><rect x="0" y="550" width="760" height="1" fill="#1f2023"/><text x="20" y="534" font-size="22" fill="#949ba4">@</text><text x="44" y="533" font-size="16" font-weight="700" fill="#f2f3f5">Warden</text><circle cx="40" cy="590" r="20" fill="#5865f2"/><text x="40" y="597" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">W</text><text x="76" y="585" font-size="16" font-weight="600" fill="#5865f2">Warden</text><rect x="144" y="572" width="32" height="16" rx="3" fill="#5865f2"/><text x="160" y="584" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">APP</text><text x="188" y="585" font-size="12" fill="#949ba4">Today at 21:04</text><text x="76" y="608" font-size="15" fill="#dbdee1" font-weight="400" xml:space="preserve">Hi maya, welcome to <tspan font-weight="700" fill="#f2f3f5">Night Owls</tspan>! Read the rules and press <tspan font-weight="700" fill="#f2f3f5">I agree</tspan> to get access.</text></g></svg>
