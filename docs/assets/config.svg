<svg xmlns="http://www.w3.org/2000/svg" width="760" height="468" viewBox="0 0 760 468" font-family="'gg sans','Noto Sans','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="Warden settings: /config view for the automod module and a /config set reply"><title>Warden settings: /config view for the automod module and a /config set reply</title><clipPath id="r"><rect width="760" height="468" rx="12"/></clipPath><g clip-path="url(#r)"><rect width="760" height="468" fill="#313338"/><rect x="0" y="0" width="760" height="46" fill="#2b2d31"/><rect x="0" y="46" width="760" height="1" fill="#1f2023"/><text x="20" y="30" font-size="22" fill="#949ba4">#</text><text x="44" y="29" font-size="16" font-weight="700" fill="#f2f3f5">admin</text><path d="M 38 86 v -6 q 0 -6 6 -6 h 22" stroke="#4e5058" stroke-width="2" fill="none"/><circle cx="78" cy="74" r="8" fill="#e8a2c8"/><text x="92" y="79" font-size="13" fill="#949ba4"><tspan fill="#e8a2c8" font-weight="600">Ayesha</tspan> used <tspan fill="#00a8fc">/config view module:automod</tspan></text><circle cx="40" cy="100" r="20" fill="#5865f2"/><text x="40" y="107" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">W</text><text x="76" y="95" font-size="16" font-weight="600" fill="#5865f2">Warden</text><rect x="144" y="82" width="32" height="16" rx="3" fill="#5865f2"/><text x="160" y="94" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">APP</text><text x="188" y="95" font-size="12" fill="#949ba4">Today at 21:04</text><rect x="76" y="110" width="560" height="220" rx="4" fill="#2b2d31"/><rect x="76" y="110" width="4" height="220" rx="2" fill="#5865f2"/><text x="92" y="136" font-size="15" fill="#f2f3f5" font-weight="700" xml:space="preserve">Warden settings</text><text x="92" y="162" font-size="13" fill="#f2f3f5" font-weight="700" xml:space="preserve">Automod</text><text x="92" y="183" font-size="14" fill="#dbdee1" font-weight="400" xml:space="preserve"><tspan font-family="Consolas,'Liberation Mono',Menlo,monospace" font-size="13">automod.enabled</tspan>: on</text><text x="92" y="203" font-size="14" fill="#dbdee1" font-weight="400" xml:space="preserve"><tspan font-family="Consolas,'Liberation Mono',Menlo,monospace" font-size="13">automod.links_enabled</tspan>: on</text><text x="92" y="223" font-size="14" fill="#dbdee1" font-weight="400" xml:space="preserve"><tspan font-family="Consolas,'Liberation Mono',Menlo,monospace" font-size="13">automod.link_allowlist</tspan>: <tspan font-family="Consolas,'Liberation Mono',Menlo,monospace" font-size="13">tenor.com, giphy.com, youtube.com</tspan></text><text x="92" y="243" font-size="14" fill="#dbdee1" font-weight="400" xml:space="preserve"><tspan font-family="Consolas,'Liberation Mono',Menlo,monospace" font-size="13">automod.max_mentions</tspan>: <tspan font-family="Consolas,'Liberation Mono',Menlo,monospace" font-size="13">5</tspan></text><text x="92" y="263" font-size="14" fill="#dbdee1" font-weight="400" xml:space="preserve"><tspan font-family="Consolas,'Liberation Mono',Menlo,monospace" font-size="13">automod.spam_messages</tspan>: <tspan font-family="Consolas,'Liberation Mono',Menlo,monospace" font-size="13">6</tspan>  within  <tspan font-family="Consolas,'Liberation Mono',Menlo,monospace" font-size="13">automod.spam_seconds</tspan>: <tspan font-family="Consolas,'Liberation Mono',Menlo,monospace" font-size="13">5</tspan></text><text x="92" y="283" font-size="14" fill="#dbdee1" font-weight="400" xml:space="preserve"><tspan font-family="Consolas,'Liberation Mono',Menlo,monospace" font-size="13">automod.timeout_at</tspan>: <tspan font-family="Consolas,'Liberation Mono',Menlo,monospace" font-size="13">3</tspan>  ·  <tspan font-family="Consolas,'Liberation Mono',Menlo,monospace" font-size="13">automod.kick_at</tspan>: <tspan font-family="Consolas,'Liberation Mono',Menlo,monospace" font-size="13">5</tspan>  ·  <tspan font-family="Consolas,'Liberation Mono',Menlo,monospace" font-size="13">automod.ban_at</tspan>: <tspan font-family="Consolas,'Liberation Mono',Menlo,monospace" font-size="13">7</tspan></text><text x="92" y="312" font-size="12" fill="#949ba4" font-weight="400" xml:space="preserve">Change one with /config set, restore its default with /config reset</text><text x="76" y="347" font-size="12" fill="#949ba4" font-weight="400" xml:space="preserve">Only you can see this  ·  Dismiss message</text><path d="M 38 388 v -6 q 0 -6 6 -6 h 22" stroke="#4e5058" stroke-width="2" fill="none"/><circle cx="78" cy="376" r="8" fill="#e8a2c8"/><text x="92" y="381" font-size="13" fill="#949ba4"><tspan fill="#e8a2c8" font-weight="600">Ayesha</tspan> used <tspan fill="#00a8fc">/config set key:automod.ban_at value:10</tspan></text><circle cx="40" cy="402" r="20" fill="#5865f2"/><text x="40" y="409" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">W</text><text x="76" y="397" font-size="16" font-weight="600" fill="#5865f2">Warden</text><rect x="144" y="384" width="32" height="16" rx="3" fill="#5865f2"/><text x="160" y="396" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">APP</text><text x="188" y="397" font-size="12" fill="#949ba4">Today at 21:04</text><text x="76" y="420" font-size="15" fill="#dbdee1" font-weight="400" xml:space="preserve"><tspan font-family="Consolas,'Liberation Mono',Menlo,monospace" font-size="14">automod.ban_at</tspan> is now <tspan font-family="Consolas,'Liberation Mono',Menlo,monospace" font-size="14">10</tspan>.</text><text x="76" y="443" font-size="12" fill="#949ba4" font-weight="400" xml:space="preserve">Only you can see this  ·  Dismiss message</text></g></svg>
