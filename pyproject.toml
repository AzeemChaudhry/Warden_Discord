[project]
name = "warden"
version = "0.1.0"
description = "An all-in-one Discord guardian: moderation, automod, onboarding, leveling and perks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.6",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
]

[project.scripts]
warden = "warden.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["warden"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# The formatter owns line length; long user-facing strings are left intact.
ignore = ["E501", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["warden"]
